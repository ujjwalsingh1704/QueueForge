services:
  - type: web
    name: outbox-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:all
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: outbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: outbox-redis
          type: keyvalue
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: SLACK_CLIENT_ID
        value: ""
      - key: SLACK_CLIENT_SECRET
        value: ""
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: "2000"
  - type: keyvalue
    name: outbox-redis
    plan: free
    region: singapore
    ipAllowList: []

databases:
  - name: outbox-db
    plan: free
    region: singapore
    databaseName: outbox
    user: outbox
